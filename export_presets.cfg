[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="resources"
; `run_save_store.gd` and portraits are loaded by data-driven runtime paths;
; selected-scene dependency discovery cannot infer those String paths.
export_files=PackedStringArray("res://scenes/run.tscn", "res://app/run_save_store.gd", "res://assets/portraits/chiyan_lihui_transparent_v2.png", "res://assets/portraits/yuanshuai_lihui.png", "res://assets/portraits/qishi_lihui_transparent.png", "res://assets/portraits/yanshushi_lihui_transparent_v2.png", "res://assets/portraits/ningbufan_lihui_transparent_v2.png", "res://assets/portraits/chenge_lihui_transparent.png", "res://assets/portraits/qianji_lihui.png", "res://assets/portraits/yingshou_lihui_transparent_v2.png")
include_filter=""
exclude_filter=""
export_path="dist/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.1.options]

; Godot's Web default is single-threaded: appropriate for static hosting and
; does not require COOP/COEP response headers.
variant/thread_support=false

[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
; GDScript `preload()` dependencies are not recursively discovered by the
; selected-resource exporter. Export all game resources, then explicitly omit
; non-runtime material so the Web PCK remains complete without bundling tests,
; documents, development tools, or retired piece art.
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,docs/*,tools/*,ui/art/pieces/*"
export_path="dist/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.1.options]

; Godot's Web default is single-threaded: appropriate for static hosting and
; does not require COOP/COEP response headers.
variant/thread_support=false

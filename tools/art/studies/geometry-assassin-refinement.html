<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>弈者 · 几何刺客优化</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#18251f;color:#e4decb;font:14px/1.6 'Microsoft YaHei',sans-serif}main{max-width:1360px;margin:auto;padding:28px 32px 40px}header{display:flex;justify-content:space-between;align-items:end;gap:24px;border-bottom:1px solid #4c5848;padding-bottom:18px}h1{font-size:24px;font-weight:500;margin:0 0 4px;letter-spacing:2px}p{margin:0;color:#aeb7a8;font-size:12px}.eyebrow{color:#bca879;font-size:11px;letter-spacing:2px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:18px 0 20px}button{font:inherit;color:#d9dcc9;background:#26392f;border:1px solid #55654d;border-radius:5px;padding:8px 15px;cursor:pointer}button:hover,button:focus-visible{background:#3c5343;outline-color:#d3c08f}button[aria-pressed=true]{background:#d9d3ba;color:#23352b;border-color:#d9d3ba}.spacer{flex:1}label{font-size:12px;color:#c0c8b8;margin-left:10px;cursor:pointer}input{accent-color:#aabd99;vertical-align:middle}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{min-width:0;background:#202f27;border:1px solid #465642;border-radius:8px;overflow:hidden}.panel-heading{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid #3b4d3d}h2{font-size:17px;font-weight:500;margin:0}.number{color:#b6aa85;font-family:Georgia,serif;font-size:19px;margin-right:10px}.meta{color:#9fae9b;font-size:11px}.zoom{display:block;width:100%;height:250px;background:#34443b}.caption{display:flex;justify-content:space-between;padding:12px 20px 6px;font-size:11px;color:#a9b59f}.board{display:block;width:100%;height:350px;background:#34443b}.note{padding:14px 20px;min-height:65px;font-size:12px;color:#bdc6b5}.mono canvas{filter:grayscale(1)}footer{margin-top:18px;font-size:12px;color:#a6b29f}#status{color:#c7cbb8}.legend{color:#899a85;font-size:11px}.loading{padding:40px;color:#d5b991}@media(max-width:850px){main{padding:20px 16px}.compare{grid-template-columns:1fr}header{align-items:start;flex-direction:column;gap:8px}.spacer{display:none}.controls{gap:6px}button{padding:7px 10px}label{margin-left:3px}.zoom{height:250px}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">弈者 / 棋像研究</div><h1>让刺客轻下来</h1><p>方案三已选定。这次只调整刺客；其余三种弈子保持原样。</p></div><span class="meta">几何弈子 / 刺客迭代</span></header>
<div class="controls" aria-label="对比控制">
<button data-kind="shield" aria-pressed="false">甲卒</button><button data-kind="crossbow" aria-pressed="false">机弩</button><button data-kind="assassin" aria-pressed="true">刺客</button><button data-kind="banner" aria-pressed="false">旗兵</button><span class="spacer"></span>
<button id="move">同时出手</button><button id="hold" aria-pressed="false">动作定格</button><label><input id="labels" type="checkbox" checked>兵种名称</label><label><input id="mono" type="checkbox">去色观察</label>
</div>
<div class="compare">
<section class="panel" id="option2"><div class="panel-heading"><h2><span class="number">01</span>优化前</h2><span class="meta">厚切斜刃 / 稳定重心</span></div><canvas class="zoom" aria-label="优化前选中兵种放大，双方相向"></canvas><div class="caption"><span>十二枚同场</span><span>我方 →　← 敌方</span></div><canvas class="board" aria-label="优化前十二枚棋子实战尺寸"></canvas><div class="note">正在加载独立设计…</div></section>
<section class="panel" id="option3"><div class="panel-heading"><h2><span class="number">02</span>优化后</h2><span class="meta">轻薄棱片 / 偏置重心</span></div><canvas class="zoom" aria-label="优化后选中兵种放大，双方相向"></canvas><div class="caption"><span>十二枚同场</span><span>我方 →　← 敌方</span></div><canvas class="board" aria-label="优化后十二枚棋子实战尺寸"></canvas><div class="note">正在加载独立设计…</div></section>
</div>
<footer><span id="status" aria-live="polite">刺客 · 静止</span><br><span class="legend">独立美术样稿，不修改当前游戏。重点比较刺客的静止重心、出手姿态，以及它在整队中的辨识度。</span></footer>
</main>
<script type="module">
const names={shield:'甲卒',crossbow:'机弩',assassin:'刺客',banner:'旗兵'};
const roster=['shield','crossbow','assassin','banner','shield','crossbow'];
const state={kind:'assassin',pose:0,held:false,labels:true};let animation=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const modules=await Promise.all([import('./piece-option3.js'),import('./piece-geometry-v2.js')]);
const panels=modules.map((module,i)=>({module,root:document.querySelector('#option'+(i+2))}));
function setup(canvas){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w,h};}
function text(c,s,x,y,color='#c6cbb6',size=11){c.fillStyle=color;c.font=`${size}px 'Microsoft YaHei',sans-serif`;c.textAlign='center';c.fillText(s,x,y);}
function render(){for(const {module,root} of panels){let {ctx:c,w,h}=setup(root.querySelector('.zoom'));c.fillStyle='#34443b';c.fillRect(0,0,w,h);const scale=Math.min(1.05,w/480);for(const enemy of [false,true]){const x=w*(enemy?.75:.25);module.drawPiece(c,state.kind,x,216,scale,enemy?-1:1,enemy,enemy?0:state.pose);text(c,enemy?'敌方':'我方',x,240,'#acb99f',10);}text(c,names[state.kind],w/2,24,'#d6d6bd',12);
({ctx:c,w,h}=setup(root.querySelector('.board')));c.fillStyle='#34443b';c.fillRect(0,0,w,h);c.strokeStyle='#bcc19c25';c.beginPath();c.moveTo(w/2,12);c.lineTo(w/2,h-16);c.stroke();const s=Math.min(.46,w/1160);for(let side=0;side<2;side++)for(let i=0;i<6;i++){const row=Math.floor(i/2),col=i%2;const x=side?w-w*(.13+col*.235):w*(.13+col*.235);const y=96+row*112;module.drawPiece(c,roster[i],x,y,s,side?-1:1,!!side,!side&&roster[i]===state.kind?state.pose:0);if(state.labels)text(c,names[roster[i]],x,y+17,'#c5cbb5',10);c.fillStyle='#1f3026';c.fillRect(x-25,y+23,50,2);c.fillStyle=side?'#b98773':'#a9bea0';c.fillRect(x-25,y+23,42,2);}}
document.querySelector('#status').textContent=names[state.kind]+' · '+(state.held?'动作峰值':state.pose?'出手中':'静止');}
for(const p of panels)p.root.querySelector('.note').textContent=p.module.designNotes;
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{state.kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(el=>el.setAttribute('aria-pressed',el===b));render();});
document.querySelector('#move').onclick=()=>{cancelAnimationFrame(animation);state.held=false;document.querySelector('#hold').setAttribute('aria-pressed','false');if(reduce.matches){state.pose=1;state.held=true;document.querySelector('#hold').setAttribute('aria-pressed','true');render();return;}const start=performance.now();function frame(now){const t=Math.min(1,(now-start)/850);state.pose=t<.32?Math.sin(t/.32*Math.PI/2):Math.cos((t-.32)/.68*Math.PI/2)**2;if(t>=1)state.pose=0;render();if(t<1)animation=requestAnimationFrame(frame);}animation=requestAnimationFrame(frame);};
document.querySelector('#hold').onclick=()=>{cancelAnimationFrame(animation);state.held=!state.held;state.pose=state.held?1:0;document.querySelector('#hold').setAttribute('aria-pressed',state.held);render();};
document.querySelector('#labels').onchange=e=>{state.labels=e.target.checked;render();};document.querySelector('#mono').onchange=e=>document.querySelector('.compare').classList.toggle('mono',e.target.checked);
new ResizeObserver(render).observe(document.querySelector('.compare'));render();
</script></body></html>
